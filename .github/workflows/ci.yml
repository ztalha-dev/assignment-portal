name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build image and run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t assignment-portal:${{ github.sha }} .

      - name: Run tests inside the container
        run: |
          mkdir -p reports
          echo "TESTS_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          docker run --rm -v "$PWD/reports:/app/reports" \
            assignment-portal:${{ github.sha }} \
            pytest -v --junitxml=reports/junit.xml

      - name: Build JSON test report
        if: always()
        run: python3 scripts/build_report.py reports/junit.xml test-report.json

      - name: Send report to local receiver
        if: always()
        continue-on-error: true
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
          RECEIVER_TOKEN: ${{ secrets.RECEIVER_TOKEN }}
        run: |
          if [ -z "$RECEIVER_URL" ]; then
            echo "::warning::RECEIVER_URL secret is not set; skipping delivery."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 30 \
            --retry 3 --retry-all-errors \
            -X POST "$RECEIVER_URL" \
            -H "Content-Type: application/json" \
            -H "X-Report-Token: $RECEIVER_TOKEN" \
            -H "ngrok-skip-browser-warning: true" \
            --data-binary @test-report.json
          echo
          echo "Report delivered to the local receiver."

      - name: Email test report
        if: always()
        continue-on-error: true
        env:
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: "465"
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: python3 scripts/send_email.py test-report.json