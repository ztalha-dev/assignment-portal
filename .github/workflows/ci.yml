name: CI

on:
  push:              # runs on every push, to any branch
  workflow_dispatch: # lets you re-run it manually from the Actions tab

jobs:
  test:
    name: Build image and run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t assignment-portal:${{ github.sha }} .

      - name: Run tests inside the container
        run: docker run --rm assignment-portal:${{ github.sha }} pytest -v